<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0814">
<link rel="icon" href="favicon.png">
<title>Echo Run: The Thornbound Citadel</title>
<meta name="description" content="A dark-fantasy puzzle platformer. Every death leaves an Echo of you behind. Climb on your past selves to escape the cursed citadel.">
<style>
@font-face{font-family:'Jacquard';src:url('Jacquard24.ttf') format('truetype');font-display:block}
@font-face{font-family:'DotGothic';src:url('DotGothic16.ttf') format('truetype');font-display:block}
html,body{margin:0;padding:0;width:100%;height:100%;background:#07050d;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#game{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;outline:none}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#cbb8e8;font:16px DotGothic,monospace;letter-spacing:2px}
#rotate{display:none;position:fixed;inset:0;background:#07050d;color:#e9dcff;font:18px DotGothic,monospace;text-align:center;align-items:center;justify-content:center;flex-direction:column;z-index:10;padding:24px;box-sizing:border-box}
#rotate b{font:40px Jacquard,serif;color:#ffd27a;font-weight:400}
@media (orientation:portrait) and (max-width:820px){#rotate.touch{display:flex}}
</style>
</head>
<body>
<div id="boot">Summoning the citadel…</div>
<div id="game"></div>
<div id="rotate"><b>Echo Run</b><p>Turn your device sideways to play.</p><p style="font-size:40px">&#10227;</p></div>
<script src="phaser.min.js"></script>
<script src="sim.js"></script>
<script src="levels.js"></script>
<script src="portal.js"></script>
<script src="game.js"></script>
</body>
</html>
